<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Voice Timer</title>
  <meta name="description" content="A countdown timer that speaks the remaining time aloud.">
  <meta name="theme-color" content="#101820">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Voice Timer">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
<main class="app" id="app" data-state="idle">
  <header class="bar">
    <h1>Voice Timer</h1>
    <button class="icon-btn" id="mute" type="button" aria-pressed="false" aria-label="Mute voice">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M4 9.5h3l5-4v13l-5-4H4z" fill="currentColor"></path>
        <g class="waves"><path d="M15.5 9a4.2 4.2 0 0 1 0 6"></path><path d="M18.2 6.3a8 8 0 0 1 0 11.4"></path></g>
        <g class="cross"><path d="M16 9.5l5 5"></path><path d="M21 9.5l-5 5"></path></g>
      </svg>
    </button>
  </header>

  <section class="stage" aria-label="Countdown">
    <div class="ring">
      <svg viewBox="0 0 100 100" aria-hidden="true">
        <circle class="track" cx="50" cy="50" r="46"></circle>
        <circle class="prog" id="prog" cx="50" cy="50" r="46" pathLength="100"></circle>
      </svg>
      <div class="readout">
        <div class="time" id="time" role="timer" aria-live="off">1:00</div>
        <div class="status" id="status">Ready</div>
      </div>
    </div>
  </section>

  <section class="presets" id="presets" role="radiogroup" aria-label="Duration">
    <button class="preset" type="button" role="radio" aria-checked="false" data-sec="55">0:55</button>
    <button class="preset" type="button" role="radio" aria-checked="true" data-sec="60">1:00</button>
    <button class="preset" type="button" role="radio" aria-checked="false" data-sec="65">1:05</button>
    <button class="preset" type="button" role="radio" aria-checked="false" data-sec="70">1:10</button>
    <button class="preset" type="button" role="radio" aria-checked="false" data-sec="75">1:15</button>
    <button class="preset" type="button" role="radio" aria-checked="false" data-sec="80">1:20</button>
    <button class="preset" type="button" role="radio" aria-checked="false" data-sec="85">1:25</button>
    <button class="preset" type="button" role="radio" aria-checked="false" data-sec="90">1:30</button>
  </section>

  <section class="controls" aria-label="Timer controls">
    <button class="btn start" id="start" type="button">Start</button>
    <button class="btn" id="pause" type="button" disabled>Pause</button>
    <button class="btn" id="reset" type="button" disabled>Reset</button>
  </section>
</main>

<script src="app.js"></script>
</body>
</html>
